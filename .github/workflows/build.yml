name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'age-mobile/**'
      - 'android/**'
      - '.github/workflows/build.yml'
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Age Engine & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & Licenses
        run: |
          # Accept SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Match ANDROID_NDK_HOME with runner's ANDROID_NDK_ROOT or detect
          if [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK_PATH="$ANDROID_NDK_ROOT"
          else
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "Selected NDK: $NDK_PATH"

      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Test Native Age Engine
        working-directory: age-mobile
        run: cargo test

      - name: Compile Native .so Libraries for Android
        working-directory: age-mobile
        run: |
          chmod +x build-android.sh
          ./build-android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          KEYSTORE_FILE="$RUNNER_TEMP/keystore/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured. Official release builds must use repository secrets."
            exit 1
          else
            echo "Generating ephemeral keystore for CI test build"
            RANDOM_PASS=$(head -c 32 /dev/urandom | base64)
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "ci-test" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -storepass "$RANDOM_PASS" \
              -keypass "$RANDOM_PASS" \
              -dname "CN=Passage CI Test, OU=CI, O=Passage, L=Test, ST=Test, C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$RANDOM_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=ci-test" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$RANDOM_PASS" >> $GITHUB_ENV
          fi

      - name: Build Signed Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p ../dist-apk
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../dist-apk/Passage.apk
          else
            echo "Error: app-release.apk not found!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Passage-Android-APK
          path: dist-apk/Passage.apk
          retention-days: 30

      # Rolling build of main, published as a prerelease with make_latest: false so it
      # never takes the "Latest" badge from versioned v* releases.
      - name: Publish or Update Rolling Main Build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Passage (development build - main)
          body: |
            Signed **release** APK built automatically on every push to `main`.
            For stable versions, use the [latest official release](https://github.com/${{ github.repository }}/releases/latest).
          files: dist-apk/Passage.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/Passage.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
